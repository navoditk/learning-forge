services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learning_forge
      POSTGRES_USER: learning_forge
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    volumes:
      - learning-forge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learning_forge -d learning_forge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learning-forge-postgres:
