databases:
  - name: learning-forge-db
    plan: basic-256mb
    region: oregon
    # Render's own default, if this were omitted, is the OPPOSITE of what
    # a child's data needs: any IP with valid credentials can connect
    # (effectively 0.0.0.0/0). An explicit empty list blocks all external
    # access; the web service below still reaches this database fine over
    # Render's internal network, since it's in the same account/region.
    ipAllowList: []

services:
  - type: web
    name: learning-forge
    runtime: node
    plan: starter
    region: oregon
    # Keep migrations in the build for compatibility with both Starter and
    # Free plans; prisma migrate deploy is idempotent.
    buildCommand: npm ci && npm run db:generate && npm run db:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learning-forge-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: 'true'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TUTOR_MODEL_PROVIDER
        value: anthropic
      - key: TUTOR_DAILY_HINT_LIMIT
        value: '100'
      - key: TUTOR_SESSION_HINT_LIMIT
        value: '8'
