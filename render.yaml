databases:
  - name: learning-forge-db
    plan: basic-256mb
    region: oregon
    # No ipAllowList entry: the database stays unreachable from the public
    # internet, reachable only by services in this same Render account/region
    # (this web service). Deliberate default for a child's data.

services:
  - type: web
    name: learning-forge
    runtime: node
    plan: free
    region: oregon
    # Runs the migration as part of build, not preDeployCommand, because
    # preDeployCommand requires a paid web service plan and this uses the
    # free tier (ADR-0012).
    buildCommand: npm ci && npm run db:generate && npm run db:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learning-forge-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: 'true'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TUTOR_MODEL_PROVIDER
        value: anthropic
