name: Bug report
description: Report a reproducible problem.
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal reproduction steps without secrets or private learner data.
    validations:
      required: true
