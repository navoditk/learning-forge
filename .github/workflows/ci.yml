name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_forge
          POSTGRES_USER: learning_forge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning_forge -d learning_forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure local database
        run: echo "DATABASE_URL=postgresql://learning_forge@localhost:5432/learning_forge?schema=public" >> "$GITHUB_ENV"
      - name: Configure auth secret
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Validate and apply database schema
        run: npm run db:validate && npm run db:generate && npm run db:deploy
      - name: Run persistence integration tests
        run: npm run test:integration
      - name: Run verification suite
        run: npm run verify
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
